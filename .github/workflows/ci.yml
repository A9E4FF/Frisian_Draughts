name: Rust checks
on: [push, pull_request]
jobs:
  windows-engine:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked
      - run: cargo build --release --locked
      - name: Test real Hub match integration
        shell: pwsh
        run: |
          $env:FRISIAN_TEST_ENGINE = "$pwd/target/release/frisian-draughts.exe"
          python -m unittest discover -s tools/testbench/tests -v
      - name: Package Hub executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/frisian-draughts | Out-Null
          Copy-Item target/release/frisian-draughts.exe,license.txt,README.md,docs/hub-testbench.md dist/frisian-draughts/
          "Source: https://github.com/$env:GITHUB_REPOSITORY/tree/$env:GITHUB_SHA" | Set-Content dist/frisian-draughts/SOURCE.txt
          $hash = (Get-FileHash dist/frisian-draughts/frisian-draughts.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  frisian-draughts.exe" | Set-Content dist/frisian-draughts/SHA256SUMS.txt
          Compress-Archive -Path dist/frisian-draughts -DestinationPath dist/frisian-draughts-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: frisian-draughts-windows-x64
          path: dist/frisian-draughts-windows-x64.zip
  hub-contract:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -W error::ResourceWarning -m unittest discover -s tools/testbench/tests -v
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tools/position_suite/tests -v
      - run: cargo build --release
      - run: FRISIAN_TEST_ENGINE="$PWD/target/release/frisian-draughts" python3 -m unittest discover -s tools/testbench/tests -v
      - run: python3 -m tools.position_suite run tools/position_suite/sample-suite.json --engine target/release/frisian-draughts --logs /tmp/frisian-position-logs
      - name: Fetch pinned Scan reference
        run: |
          git clone https://github.com/A9E4FF/scan.git "$RUNNER_TEMP/scan"
          git -C "$RUNNER_TEMP/scan" checkout 7aae17e7b7bfc47744601afb1ee7655e18983ce5
      - run: python3 tools/differential.py "$RUNNER_TEMP/scan"

