name: Unified desktop
on: [push, pull_request]
jobs:
  qt:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            suffix: ''
          - os: windows-latest
            suffix: '.exe'
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      FRISIAN_QT_TESTS: '1'
      FRISIAN_TEST_ENGINE: ${{ github.workspace }}/target/release/frisian-draughts${{ matrix.suffix }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/testbench/requirements-build.txt
      - name: Install offscreen Qt system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0
      - run: cargo build --release --locked
      - run: python -W error::ResourceWarning -m unittest discover -s tools/testbench/tests -v
      - run: python -m unittest discover -s tools/position_suite/tests -v
      - name: Build Windows desktop
        if: runner.os == 'Windows'
        run: python -m tools.testbench.build_desktop
      - name: Test packaged Windows desktop
        if: runner.os == 'Windows'
        timeout-minutes: 2
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "$pwd/dist/FrisianDraughtsTestbench/FrisianDraughtsTestbench.exe" -ArgumentList @('--smoke-test', '--smoke-output', "$pwd/desktop-smoke") -WindowStyle Hidden -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Packaged desktop failed: $($process.ExitCode)" }
          if (!(Test-Path desktop-smoke/passed.json)) { throw 'Packaged smoke result missing' }
      - name: Package desktop ZIP
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/FrisianDraughtsTestbench -DestinationPath dist/frisian-desktop-windows-x64.zip
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: frisian-desktop-windows-x64
          path: dist/frisian-desktop-windows-x64.zip
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: desktop-diagnostics-${{ runner.os }}
          path: |
            desktop-smoke/
            dist/FrisianDraughtsTestbench/startup-error.txt
